<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Blog</title>
    <link rel="stylesheet" href="src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/2190736b83.js"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="src/main.ts" defer></script>
  </head>
  <body>
    <header>
      <h1>Mini Blog</h1>
      <button id="create-btn">Create new Blog</button>
    </header>

    <div>
      <input type="text" placeholder="Search Blogs....." id="search-input" />
    </div>

    <div></div>

    <section id="blog-container"></section>

    <div class="modal-overlay" id="blog-modal" style="display: none">
      <div class="modal-card">
        <form class="create-form">
          <div class="input-form">
            <input name="title" type="text" id="title" required  placeholder="Enter blog title"/>
            <label for="title">Title</label>
          </div>
          <div class="input-form">
            <textarea name="content" id="content" required placeholder="Short description of your blog"></textarea>
            <label for="content">Content</label>
          </div>
          <div class="input-form">
            <textarea name="description" id="description" required placeholder="Write your blog content here.."></textarea>
            <label for="description">Description</label>
          </div>
          <div class="input-form">
            <input name="image" type="text" id="image" required placeholder="https://example.com/image.jpg"/>
            <label for="image">Image URL</label>
          </div>

          <div class="form-actions">
            <button type="submit" class="submit-btn">Create</button>
            <button type="button" id="cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <footer>
      <h3>Mini Blog</h3>
      <p>Share your thoughts. Inspire the world.</p>
      <p>&copy; 2026 Mini Blog. All rights reserved.</p>
    </footer>
  </body>
</html>
